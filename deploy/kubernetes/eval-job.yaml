apiVersion: batch/v1
kind: Job
metadata:
  name: synthetic-agent-eval
spec:
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: agent-eval
          image: agentic-engineering-roadmap:local
          args: ["run", "--cases", "/app/synthetic-data/support_cases.jsonl", "--out", "/output/run"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: output
              mountPath: /output
      volumes:
        - name: output
          emptyDir: {}
