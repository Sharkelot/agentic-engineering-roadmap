name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,local-http]'
      - run: pytest
      - run: ruff check .
      - run: mypy src scripts
      - run: python -m scripts.validate_course
      - run: agent-eval run --cases synthetic-data/support_cases.jsonl --out /tmp/agent-eval-ci-run
